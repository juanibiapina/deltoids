name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'crates/deltoids/**'
      - 'crates/deltoids-wasm/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'crates/deltoids/**'
      - 'crates/deltoids-wasm/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one in-progress deploy at a time; new pushes queue rather than
# cancel so we never lose a deployment mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      # --- Build the browser PR reviewer wasm engine (crates/deltoids-wasm) ---
      # The tree-sitter C grammars need a wasi-libc sysroot to compile for wasm,
      # supplied by wasi-sdk. The result is copied into site/public/review/ and
      # then picked up by the Astro build below.
      - name: Install Rust (wasm32-wasip1)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Download wasi-sdk
        working-directory: ${{ github.workspace }}
        run: |
          ver=34
          curl -sL -o wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${ver}/wasi-sdk-${ver}.0-x86_64-linux.tar.gz"
          tar xzf wasi-sdk.tar.gz
          echo "WASI_SDK=${{ github.workspace }}/wasi-sdk-${ver}.0-x86_64-linux" >> "$GITHUB_ENV"

      - name: Build wasm engine
        working-directory: ${{ github.workspace }}
        run: bash crates/deltoids-wasm/build-wasm.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test reviewer helpers
        run: npm test

      - name: Type-check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
