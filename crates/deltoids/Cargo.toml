[package]
name = "deltoids"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[dependencies]
git2 = { version = "0.21", optional = true }
ratatui = { version = "0.30", optional = true }
toml = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
gix-imara-diff = { version = "0.2", features = ["unified_diff"] }
# Syntax and theme assets come from two-face's embedded syntect dumps on every
# target; only the regex engine differs: oniguruma on native, fancy-regex on
# wasm. Keep the base dep engine-free so wasm never pulls the C oniguruma build.
syntect = { version = "5", default-features = false }
tree-sitter = "0.26"
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-hcl = { version = "1.1", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-language = "0.1"
tree-sitter-lua = { version = "0.5", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-sequel = { version = "0.3", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
unicode-segmentation = "1"
unicode-width = "0.2"
rustc-hash = "2"

# Native (non-wasm): oniguruma regex, terminal theme detection, and the
# platform config directory. two-face brings dump-load and the embedded
# syntax/theme dumps, so syntect's own bundled defaults are left out.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
terminal-colorsaurus = "1.0"

# Wasm (browser): pure-Rust fancy-regex engine so there is no filesystem or C
# oniguruma dependency. Minimal syntect (parsing + fancy-regex only) keeps the
# wasm data section small.
[target.'cfg(target_arch = "wasm32")'.dependencies]
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# Host-only: parse vendored `.tmTheme` plists and emit compressed syntect dumps
# in `build.rs`. `plist-load` reads the plist; `dump-create` writes the dump.
# Resolver v2 keeps these features off the wasm/native normal `syntect` dep.
[build-dependencies]
syntect = { version = "5", default-features = false, features = ["parsing", "plist-load", "dump-create", "regex-fancy"] }

[dev-dependencies]
tempfile = "3"

[features]
default = [
    "lang-bash",
    "lang-c",
    "lang-cpp",
    "lang-css",
    "lang-go",
    "lang-hcl",
    "lang-java",
    "lang-javascript",
    "lang-json",
    "lang-kotlin",
    "lang-lua",
    "lang-markdown",
    "lang-python",
    "lang-ruby",
    "lang-rust",
    "lang-sql",
    "lang-toml",
    "lang-typescript",
    "lang-yaml",
]
# One tree-sitter grammar each. Without one, that language's files diff like
# an unknown language: no breadcrumbs, hunk expansion, definitions, or symbols.
lang-bash = ["dep:tree-sitter-bash"]
lang-c = ["dep:tree-sitter-c"]
lang-cpp = ["dep:tree-sitter-cpp"]
lang-css = ["dep:tree-sitter-css"]
lang-go = ["dep:tree-sitter-go"]
lang-hcl = ["dep:tree-sitter-hcl"]
lang-java = ["dep:tree-sitter-java"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-json = ["dep:tree-sitter-json"]
lang-kotlin = ["dep:tree-sitter-kotlin-ng"]
lang-lua = ["dep:tree-sitter-lua"]
lang-markdown = ["dep:tree-sitter-md"]
lang-python = ["dep:tree-sitter-python"]
lang-ruby = ["dep:tree-sitter-ruby"]
lang-rust = ["dep:tree-sitter-rust"]
lang-sql = ["dep:tree-sitter-sequel"]
lang-toml = ["dep:tree-sitter-toml-ng"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-yaml = ["dep:tree-sitter-yaml"]
# Resolve before/after content for a `parse::FileDiff` from a git
# repository's object database (uses libgit2 via the `git2` crate).
blob-resolve = ["dep:git2"]
# Render `Hunk`s and headers as ratatui `Line<'static>` values for use in
# the scrolling TUI.
ratatui = ["dep:ratatui"]
# Render `Hunk`s as semantic HTML for the web PR reviewer.
html = []

[lints]
workspace = true
