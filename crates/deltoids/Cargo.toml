[package]
name = "deltoids"
version.workspace = true
edition.workspace = true

[dependencies]
git2 = { version = "0.21", optional = true }
ratatui = { version = "0.30", optional = true }
toml = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
gix-imara-diff = { version = "0.2", features = ["unified_diff"] }
# The regex engine and bundled syntax/theme assets are selected per target:
# native uses oniguruma via bat, wasm uses fancy-regex via two-face. Keep the
# base dep engine-free so wasm never pulls the C oniguruma build.
syntect = { version = "5", default-features = false }
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-hcl = "1.1"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-language = "0.1"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-sequel = "0.3"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
unicode-segmentation = "1"
unicode-width = "0.2"

# Native (non-wasm): oniguruma regex, bat-bundled syntax/theme assets, terminal
# theme detection, and platform config/cache directories.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"
syntect = { version = "5", default-features = false, features = ["default-onig"] }
bat = { version = "0.26", default-features = false, features = ["regex-fancy"] }
terminal-colorsaurus = "1.0"

# Wasm (browser): pure-Rust fancy-regex engine and two-face's embedded syntect
# dumps (the same syntaxes/themes bat ships) so there is no filesystem or C
# oniguruma dependency.
# Minimal syntect (parsing + fancy-regex only); two-face brings dump-load and
# the embedded syntax/theme dumps, so syntect's own bundled defaults are left
# out to keep the wasm data section small.
[target.'cfg(target_arch = "wasm32")'.dependencies]
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Resolve before/after content for a `parse::FileDiff` from a git
# repository's object database (uses libgit2 via the `git2` crate).
blob-resolve = ["dep:git2"]
# Render `Hunk`s and headers as ratatui `Line<'static>` values for use in
# scrolling TUIs (review, traces).
ratatui = ["dep:ratatui"]
# Render `Hunk`s as semantic HTML for the `deltoids serve` web app.
html = []

[lints]
workspace = true
