<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>deltoids · review a GitHub PR</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">deltoids<span class="brand-dim"> review</span></div>
        <form id="pr-form" class="pr-form">
          <input
            id="pr-url"
            class="pr-input"
            type="text"
            placeholder="github.com/owner/repo/pull/123"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="go" type="submit">Review</button>
          <button id="token-btn" type="button" title="GitHub token">
            <span class="token-glyph">🔑</span>
            <span class="token-dot" aria-hidden="true"></span>
          </button>
        </form>
      </div>
      <div id="toolbar" class="toolbar" hidden>
        <button id="files-btn" class="tool" type="button" aria-expanded="false">
          Files
        </button>
        <div class="tool-group">
          <button
            id="wrap-btn"
            class="tool"
            type="button"
            aria-pressed="true"
            title="Wrap long lines"
          >
            Wrap
          </button>
          <div class="size-cycle" role="group" aria-label="Text size">
            <button id="size-down" class="tool" type="button" title="Smaller text">
              A<span class="minus">−</span>
            </button>
            <button id="size-up" class="tool" type="button" title="Larger text">
              A<span class="plus">+</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <div id="scrim" class="scrim" hidden></div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <main id="app"></main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
